[package]
name = "matc"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.4"
clap = { version = "4.6.7", features = ["derive", "cargo"] }
indexmap = "2.2"
inkwell = { version = "0.10.0", features = ["llvm18-1"] }
smallvec = "1.13"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
winnow = "0.6"
miette = { version = "7.2", features = ["fancy"] }

[dev-dependencies]
tempfile = "3.27.0"
insta = { version = "1.48.0", features = ["yaml"] }

# Rapid edit-test loop profile settings
[profile.dev]
opt-level = 0
debug = true

# Optimize dependencies in dev mode so heavy LLVM API calls aren't sluggish
[profile.dev.package."*"]
opt-level = 2

# Profile for cargo test runs
[profile.test]
opt-level = 0
debug = 1

# Production release build settings
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
